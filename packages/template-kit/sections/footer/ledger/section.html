<footer id="footer" data-lz-slot="footer" data-lz-variant="ledger" class="lz-section lz-footer-ledger">
  <div class="lz-container">
    <div class="lz-footer-ledger__head">
      <p class="lz-footer-ledger__name">{{name}}</p>
      <p class="lz-footer-ledger__about" data-lz-key="about"></p>
    </div>
    <dl class="lz-footer-ledger__rows">
      <div class="lz-footer-ledger__row" data-lz-each="branches">
        <dt class="lz-footer-ledger__label" data-lz-key="name"></dt>
        <dd class="lz-footer-ledger__value"><span class="lz-footer-ledger__line" data-lz-key="address"></span> <span class="lz-footer-ledger__line lz-footer-ledger__line--muted" data-lz-if="hours" data-lz-key="hours"></span></dd>
      </div>
      <div class="lz-footer-ledger__row">
        <dt class="lz-footer-ledger__label" data-lz-key="contactTitle"></dt>
        <dd class="lz-footer-ledger__value lz-footer-ledger__value--links"><a href="{{phoneUrl}}" class="lz-footer-ledger__link">{{phone}}</a> <a href="{{emailUrl}}" class="lz-footer-ledger__link lz-footer-ledger__link--wrap">{{email}}</a> <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-footer-ledger__link">WhatsApp</a></dd>
      </div>
      <div class="lz-footer-ledger__row">
        <dt class="lz-footer-ledger__label" data-lz-key="linksTitle"></dt>
        <dd class="lz-footer-ledger__value">
          <nav aria-label="Enlaces del pie">
            <ul class="lz-footer-ledger__nav">
              <li data-lz-each="links"><a class="lz-footer-ledger__link" data-lz-attr-href="href" data-lz-key="label"></a></li>
            </ul>
          </nav>
        </dd>
      </div>
    </dl>
    <div class="lz-footer-ledger__base">
      <p class="lz-footer-ledger__legal">© {{year}} {{name}} · Hecho con Lattiz</p>
      <div class="lz-footer-ledger__socials">
        <a href="{{instagramUrl}}" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="lz-footer-ledger__social"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="lz-footer-ledger__icon"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.7"></rect><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"></circle><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"></circle></svg></a>
        <a href="{{tiktokUrl}}" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="lz-footer-ledger__social"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="lz-footer-ledger__icon"><path d="M14.5 3c.44 1.9 1.58 3.49 3.5 4.2v2.93a8.33 8.33 0 0 1-3.5-1.02v6.12A5.23 5.23 0 1 1 9.27 10.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <a href="{{facebookUrl}}" target="_blank" rel="noopener noreferrer" aria-label="Facebook" class="lz-footer-ledger__social"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="lz-footer-ledger__icon"><path d="M13.5 21v-7h2.7l.4-3h-3.1V9.13c0-.87.25-1.46 1.5-1.46H17V5.04c-.35-.05-1.56-.14-2.97-.14-2.94 0-4.95 1.8-4.95 5.1V11H6.5v3h2.58v7h4.42Z" fill="currentColor"></path></svg></a>
      </div>
    </div>
  </div>
</footer>
