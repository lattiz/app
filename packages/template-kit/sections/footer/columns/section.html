<footer id="footer" data-lz-slot="footer" data-lz-variant="columns" class="lz-section lz-footer-cols">
  <div class="lz-container">
    <div class="lz-footer-cols__grid">
      <div class="lz-footer-cols__brand">
        <p class="lz-footer-cols__name">{{shortName}}</p>
        <p class="lz-footer-cols__about" data-lz-key="about"></p>
        <div class="lz-socials">
          <a href="{{instagramUrl}}" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="lz-socials__link">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="lz-socials__icon"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.7"></rect><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"></circle><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"></circle></svg>
          </a>
          <a href="{{tiktokUrl}}" target="_blank" rel="noopener noreferrer" aria-label="TikTok" class="lz-socials__link">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="lz-socials__icon"><path d="M14.5 3c.44 1.9 1.58 3.49 3.5 4.2v2.93a8.33 8.33 0 0 1-3.5-1.02v6.12A5.23 5.23 0 1 1 9.27 10.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </a>
          <a href="{{facebookUrl}}" target="_blank" rel="noopener noreferrer" aria-label="Facebook" class="lz-socials__link">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="lz-socials__icon"><path d="M13.5 21v-7h2.7l.4-3h-3.1V9.13c0-.87.25-1.46 1.5-1.46H17V5.04c-.35-.05-1.56-.14-2.97-.14-2.94 0-4.95 1.8-4.95 5.1V11H6.5v3h2.58v7h4.42Z" fill="currentColor"></path></svg>
          </a>
          <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" class="lz-socials__link">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="lz-socials__icon"><path d="M20.52 3.48A11.9 11.9 0 0 0 12.08 0C5.48 0 .08 5.39.08 12c0 2.11.56 4.17 1.61 5.98L0 24l6.33-1.66A11.9 11.9 0 0 0 12.06 24h.01c6.61 0 12-5.39 12-12 0-3.2-1.24-6.21-3.55-8.52Zm-8.45 18.5h-.01a9.98 9.98 0 0 1-5.08-1.39l-.36-.22-3.8 1 1.02-3.7-.24-.38A10.04 10.04 0 0 1 2.08 12c0-5.5 4.48-9.98 10-9.98a9.94 9.94 0 0 1 7.08 2.93A9.94 9.94 0 0 1 22.08 12c0 5.5-4.48 9.98-10.01 9.98Zm5.47-7.49c-.3-.15-1.77-.88-2.05-.98-.28-.1-.48-.15-.68.15-.2.3-.77.98-.95 1.18-.17.2-.35.22-.65.08-.3-.15-1.28-.47-2.43-1.5-.9-.8-1.49-1.76-1.67-2.06-.18-.3-.01-.46.13-.61.13-.13.3-.34.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.08-.15-.68-1.64-.93-2.24-.24-.58-.49-.5-.68-.5h-.58c-.2 0-.52.08-.8.38-.28.3-1.05 1.03-1.05 2.49 0 1.47 1.08 2.89 1.23 3.09.15.2 2.09 3.19 5.06 4.47.71.31 1.26.49 1.7.63.71.22 1.36.19 1.88.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.18-1.42-.08-.12-.28-.2-.58-.35Z" fill="currentColor"></path></svg>
          </a>
        </div>
      </div>
      <div class="lz-footer-cols__col">
        <h3 class="lz-footer-cols__title" data-lz-key="branchesTitle"></h3>
        <ul class="lz-footer-cols__list">
          <li class="lz-footer-cols__item" data-lz-each="branches">
            <strong data-lz-key="name"></strong>
            <span class="lz-footer-cols__muted" data-lz-key="address"></span>
            <span class="lz-footer-cols__muted" data-lz-key="hours"></span>
          </li>
        </ul>
      </div>
      <div class="lz-footer-cols__col">
        <h3 class="lz-footer-cols__title" data-lz-key="linksTitle"></h3>
        <ul class="lz-footer-cols__list">
          <li class="lz-footer-cols__item" data-lz-each="links">
            <a class="lz-footer-cols__link" data-lz-attr-href="href" data-lz-key="label"></a>
          </li>
        </ul>
      </div>
      <div class="lz-footer-cols__col">
        <h3 class="lz-footer-cols__title" data-lz-key="contactTitle"></h3>
        <ul class="lz-footer-cols__list">
          <li class="lz-footer-cols__item"><a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-footer-cols__link">WhatsApp</a></li>
          <li class="lz-footer-cols__item"><a href="{{phoneUrl}}" class="lz-footer-cols__link">{{phone}}</a></li>
          <li class="lz-footer-cols__item"><a href="{{emailUrl}}" class="lz-footer-cols__link">{{email}}</a></li>
        </ul>
      </div>
    </div>
    <div class="lz-footer-cols__bottom">
      <span>© {{year}} {{name}}. Todos los derechos reservados.</span>
      <span>Hecho con Lattiz</span>
    </div>
  </div>
</footer>
