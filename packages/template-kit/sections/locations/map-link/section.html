<section id="sucursales" data-lz-slot="locations" data-lz-variant="map-link" class="lz-section lz-locations-book">
  <div class="lz-container lz-locations-book__grid">
    <div class="lz-locations-book__contact">
      <h2 class="lz-title lz-title--section lz-locations-book__title" data-lz-key="title"></h2>
      <p class="lz-locations-book__text" data-lz-key="contactText"></p>
      <ul class="lz-locations-book__channels">
        <li><a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-locations-book__channel lz-locations-book__channel--primary"><span class="lz-locations-book__label" data-lz-key="whatsappLabel"></span><span class="lz-locations-book__value" data-lz-key="whatsappValue"></span></a></li>
        <li><a href="{{phoneUrl}}" class="lz-locations-book__channel"><span class="lz-locations-book__label" data-lz-key="callLabel"></span><span class="lz-locations-book__value">{{phone}}</span></a></li>
        <li><a href="{{emailUrl}}" class="lz-locations-book__channel"><span class="lz-locations-book__label" data-lz-key="emailLabel"></span><span class="lz-locations-book__value lz-locations-book__value--wrap">{{email}}</span></a></li>
      </ul>
    </div>
    <ul class="lz-locations-book__branches">
      <li class="lz-locations-book__branch" data-lz-each="branches">
        <h3 class="lz-locations-book__name" data-lz-key="name"></h3>
        <p class="lz-locations-book__address" data-lz-key="address"></p>
        <p class="lz-locations-book__hours" data-lz-key="hours"></p>
        <a target="_blank" rel="noopener noreferrer" class="lz-locations-book__directions" data-lz-attr-href="directionsUrl"><span data-lz-key="directionsLabel"></span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>
      </li>
    </ul>
  </div>
</section>
