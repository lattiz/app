<section id="sucursales" data-lz-slot="locations" data-lz-variant="arch-visit" class="lz-section lz-locations-arch-visit">
  <div class="lz-container">
    <div class="lz-locations-arch-visit__card">
      <div class="lz-locations-arch-visit__main">
        <p class="lz-locations-arch-visit__kicker" data-lz-if="kicker" data-lz-key="kicker"></p>
        <h2 class="lz-title lz-locations-arch-visit__title" data-lz-key="title"></h2>
        <p class="lz-locations-arch-visit__text" data-lz-key="contactText"></p>
        <div class="lz-locations-arch-visit__actions">
          <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-locations-arch-visit__action">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-4.9-4.3-5.1-4.5-.1-.2-1.2-1.6-1.2-3s.8-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.7 1.1 1.5 1.8 1 .9 1.8 1.2 2.1 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.6-.1 1.2Z"/></svg>
            <span data-lz-key="whatsappCta"></span>
          </a>
          <a href="{{phoneUrl}}" class="lz-button lz-button--secondary lz-locations-arch-visit__action">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>
            <span><span data-lz-key="callLabel"></span> {{phone}}</span>
          </a>
          <a href="{{emailUrl}}" class="lz-button lz-button--secondary lz-locations-arch-visit__action">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span>{{email}}</span>
          </a>
        </div>
        <div class="lz-locations-arch-visit__info">
          <article class="lz-locations-arch-visit__branch" data-lz-each="branches">
            <div class="lz-locations-arch-visit__tile">
              <h3 class="lz-locations-arch-visit__label">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
                <span data-lz-key="name"></span>
              </h3>
              <p class="lz-locations-arch-visit__value" data-lz-key="address"></p>
              <a target="_blank" rel="noopener noreferrer" class="lz-locations-arch-visit__map" data-lz-attr-href="directionsUrl" data-lz-key="directionsLabel"></a>
            </div>
            <div class="lz-locations-arch-visit__tile">
              <p class="lz-locations-arch-visit__label">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                <span data-lz-if="hoursLabel" data-lz-key="hoursLabel"></span>
              </p>
              <p class="lz-locations-arch-visit__value" data-lz-key="hours"></p>
            </div>
          </article>
        </div>
      </div>
      <figure class="lz-locations-arch-visit__media" data-lz-if="image">
        <img loading="lazy" width="800" height="1000" class="lz-locations-arch-visit__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
        <figcaption class="lz-locations-arch-visit__caption" data-lz-if="imageCaption">
          <span class="lz-locations-arch-visit__caption-title" data-lz-key="imageCaption"></span>
          <span class="lz-locations-arch-visit__caption-note" data-lz-if="imageNote" data-lz-key="imageNote"></span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
