<section id="ubicacion" data-lz-slot="locations" data-lz-variant="single-card" class="lz-section lz-location-card">
  <div class="lz-container">
    <h2 class="lz-title lz-title--section lz-location-card__title" data-lz-key="title"></h2>
    <div class="lz-location-card__card">
      <div class="lz-location-card__cell">
        <h3 class="lz-location-card__name" data-lz-key="branch.name"></h3>
        <p class="lz-location-card__value" data-lz-key="branch.address"></p>
        <a target="_blank" rel="noopener noreferrer" class="lz-location-card__link" data-lz-attr-href="branch.directionsUrl" data-lz-key="directionsLabel"></a>
      </div>
      <div class="lz-location-card__cell">
        <p class="lz-location-card__label" data-lz-key="hoursLabel"></p>
        <p class="lz-location-card__value lz-location-card__value--hours" data-lz-key="branch.hours"></p>
      </div>
      <div class="lz-location-card__cell lz-location-card__cell--actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-location-card__cta" data-lz-key="whatsappCta"></a>
        <a href="{{phoneUrl}}" class="lz-button lz-button--secondary lz-location-card__cta" data-lz-key="callCta"></a>
      </div>
    </div>
  </div>
</section>
