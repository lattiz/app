<section id="hero" data-lz-slot="hero" data-lz-variant="centered-arch" class="lz-section lz-hero-arch">
  <div class="lz-container lz-hero-arch__inner">
    <p class="lz-hero-arch__eyebrow" data-lz-key="eyebrow"></p>
    <h1 class="lz-title lz-hero-arch__title" data-lz-key="title"></h1>
    <p class="lz-hero-arch__text" data-lz-key="text"></p>
    <div class="lz-hero-arch__actions">
      <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary" data-lz-key="primaryCta"></a>
      <a class="lz-button lz-button--secondary" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
    </div>
    <div class="lz-hero-arch__media">
      <img width="1200" height="900" class="lz-hero-arch__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
      <div class="lz-hero-arch__sticker" data-lz-if="sticker">
        <span class="lz-sticker" data-lz-key="sticker"></span>
      </div>
    </div>
  </div>
</section>
