<section id="hero" data-lz-slot="hero" data-lz-variant="panel" data-lz-fit class="lz-section lz-hero-panel">
  <div class="lz-container lz-hero-panel__grid">
    <figure class="lz-hero-panel__media">
      <img fetchpriority="high" width="1200" height="1200" class="lz-hero-panel__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
    </figure>
    <div class="lz-hero-panel__panel">
      <p class="lz-hero-panel__eyebrow" data-lz-key="eyebrow"></p>
      <h1 class="lz-title lz-hero-panel__title" data-lz-key="title"></h1>
      <p class="lz-hero-panel__text" data-lz-key="text"></p>
      <div class="lz-hero-panel__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-hero-panel__cta" data-lz-key="primaryCta"></a>
        <a class="lz-button lz-button--secondary lz-hero-panel__cta" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
      <p class="lz-hero-panel__note" data-lz-if="note" data-lz-key="note"></p>
    </div>
  </div>
</section>
