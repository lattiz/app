<section id="hero" data-lz-slot="hero" data-lz-variant="framed" data-lz-fit class="lz-section lz-hero-framed">
  <div class="lz-container lz-hero-framed__frame">
    <img fetchpriority="high" width="1800" height="1100" class="lz-hero-framed__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
    <div class="lz-hero-framed__card">
      <p class="lz-hero-framed__eyebrow" data-lz-key="eyebrow"></p>
      <h1 class="lz-title lz-hero-framed__title" data-lz-key="title"></h1>
      <p class="lz-hero-framed__text" data-lz-key="text"></p>
      <div class="lz-hero-framed__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-hero-framed__cta" data-lz-key="primaryCta"></a>
        <a class="lz-button lz-button--secondary lz-hero-framed__cta" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
    </div>
  </div>
</section>
