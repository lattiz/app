<section id="hero" data-lz-slot="hero" data-lz-variant="overlap" data-lz-fit class="lz-section lz-hero-overlap">
  <div class="lz-container lz-hero-overlap__grid">
    <div class="lz-hero-overlap__copy">
      <p class="lz-tag lz-hero-overlap__eyebrow" data-lz-key="eyebrow"></p>
      <h1 class="lz-title lz-hero-overlap__title" data-lz-key="title"></h1>
      <p class="lz-hero-overlap__text" data-lz-key="text"></p>
      <div class="lz-hero-overlap__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-btn" data-lz-key="primaryCta"></a>
        <a class="lz-btn lz-btn--secondary" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
    </div>
    <div class="lz-hero-overlap__stage">
      <figure class="lz-frame lz-hero-overlap__main">
        <img fetchpriority="high" width="1100" height="1300" class="lz-hero-overlap__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
      </figure>
      <figure class="lz-frame lz-frame--framed lz-hero-overlap__detail" data-lz-if="detailImage">
        <img width="600" height="600" class="lz-hero-overlap__detail-image" data-lz-attr-src="detailImage" data-lz-attr-alt="detailAlt">
      </figure>
    </div>
  </div>
</section>
