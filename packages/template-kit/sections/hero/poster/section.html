<section id="hero" data-lz-slot="hero" data-lz-variant="poster" data-lz-fit class="lz-section lz-hero-poster">
  <div class="lz-container lz-hero-poster__head">
    <p class="lz-hero-poster__eyebrow" data-lz-key="eyebrow"></p>
    <h1 class="lz-title lz-hero-poster__title" data-lz-key="title"></h1>
  </div>
  <div class="lz-hero-poster__band">
    <img fetchpriority="high" width="1800" height="800" class="lz-hero-poster__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
  </div>
  <div class="lz-container lz-hero-poster__foot">
    <p class="lz-hero-poster__text" data-lz-key="text"></p>
    <div class="lz-hero-poster__actions">
      <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-hero-poster__cta" data-lz-key="primaryCta"></a>
      <a class="lz-button lz-button--secondary lz-hero-poster__cta" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
    </div>
  </div>
</section>
