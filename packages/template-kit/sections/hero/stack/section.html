<section id="hero" data-lz-slot="hero" data-lz-variant="stack" data-lz-fit class="lz-section lz-hero-stack">
  <div class="lz-hero-stack__grid">
    <div class="lz-hero-stack__deck">
      <div class="lz-tile lz-tile--elevated lz-hero-stack__card" data-lz-name="Tarjeta">
        <p class="lz-tag lz-hero-stack__eyebrow" data-lz-key="eyebrow"></p>
        <h1 class="lz-title lz-hero-stack__title" data-lz-key="title"></h1>
        <p class="lz-hero-stack__text" data-lz-key="text"></p>
        <div class="lz-hero-stack__actions">
          <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-btn" data-lz-key="primaryCta"></a>
          <a class="lz-btn lz-btn--secondary" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
        </div>
      </div>
    </div>
    <figure class="lz-hero-stack__media">
      <img fetchpriority="high" width="1400" height="1200" class="lz-hero-stack__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
    </figure>
  </div>
</section>
