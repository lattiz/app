<section id="hero" data-lz-slot="hero" data-lz-variant="image-bg" class="lz-section lz-hero">
  <div class="lz-hero__media">
    <img class="lz-hero__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
    <div class="lz-hero__overlay"></div>
  </div>
  <div class="lz-container lz-hero__inner">
    <div class="lz-hero__content">
      <p class="lz-label" data-lz-key="eyebrow"></p>
      <h1 class="lz-title lz-title--hero" data-lz-key="title"></h1>
      <p class="lz-hero__text" data-lz-key="text"></p>
      <div class="lz-hero__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary" data-lz-key="primaryCta"></a>
        <a class="lz-button lz-button--secondary" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
      <div class="lz-hero__sticker" data-lz-if="sticker">
        <span class="lz-sticker" data-lz-key="sticker"></span>
      </div>
    </div>
  </div>
</section>
