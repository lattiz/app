<section id="hero" data-lz-slot="hero" data-lz-variant="offset-card" class="lz-section lz-hero-offset">
  <div class="lz-container lz-hero-offset__grid">
    <p class="lz-hero-offset__eyebrow" data-lz-key="eyebrow"></p>
    <h1 class="lz-title lz-hero-offset__title" data-lz-key="title"></h1>
    <div class="lz-hero-offset__copy">
      <p class="lz-hero-offset__text" data-lz-key="text"></p>
      <div class="lz-hero-offset__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary" data-lz-key="primaryCta"></a>
        <a class="lz-button lz-button--secondary" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
    </div>
    <div class="lz-hero-offset__card">
      <img width="1000" height="800" class="lz-hero-offset__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
      <div class="lz-hero-offset__sticker" data-lz-if="sticker">
        <span class="lz-sticker" data-lz-key="sticker"></span>
      </div>
    </div>
  </div>
</section>
