<section id="hero" data-lz-slot="hero" data-lz-variant="duo-arch" data-lz-fit class="lz-section lz-hero-duo">
  <div class="lz-container lz-hero-duo__grid">
    <div class="lz-hero-duo__copy">
      <p class="lz-hero-duo__eyebrow" data-lz-key="eyebrow"></p>
      <h1 class="lz-title lz-hero-duo__title" data-lz-key="title"></h1>
      <p class="lz-hero-duo__text" data-lz-key="text"></p>
      <div class="lz-hero-duo__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-hero-duo__cta" data-lz-key="primaryCta"></a>
        <a class="lz-button lz-button--secondary lz-hero-duo__cta" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
    </div>
    <div class="lz-hero-duo__media">
      <img fetchpriority="high" width="900" height="1200" class="lz-hero-duo__arch" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
      <img data-lz-if="detailImage" width="900" height="1200" class="lz-hero-duo__arch lz-hero-duo__arch--detail" data-lz-attr-src="detailImage" data-lz-attr-alt="detailAlt">
    </div>
  </div>
</section>
