<section id="hero" data-lz-slot="hero" data-lz-variant="split" class="lz-section lz-hero-split">
  <div class="lz-container lz-hero-split__grid">
    <div class="lz-hero-split__copy">
      <p class="lz-hero-split__eyebrow" data-lz-key="eyebrow"></p>
      <h1 class="lz-title lz-hero-split__title" data-lz-key="title"></h1>
      <p class="lz-hero-split__text" data-lz-key="text"></p>
      <div class="lz-hero-split__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary" data-lz-key="primaryCta"></a>
        <a class="lz-button lz-button--secondary" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
    </div>
    <div class="lz-hero-split__media">
      <img width="1000" height="1250" class="lz-hero-split__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
      <div class="lz-hero-split__sticker" data-lz-if="sticker">
        <span class="lz-sticker" data-lz-key="sticker"></span>
      </div>
    </div>
  </div>
</section>
