<section id="hero" data-lz-slot="hero" data-lz-variant="columns" data-lz-fit class="lz-section lz-hero-columns">
  <div class="lz-container lz-hero-columns__grid">
    <p class="lz-hero-columns__eyebrow" data-lz-key="eyebrow"></p>
    <h1 class="lz-title lz-hero-columns__title" data-lz-key="title"></h1>
    <figure class="lz-hero-columns__media">
      <img fetchpriority="high" width="900" height="1200" class="lz-hero-columns__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
    </figure>
    <div class="lz-hero-columns__copy">
      <p class="lz-hero-columns__text" data-lz-key="text"></p>
      <div class="lz-hero-columns__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-hero-columns__cta" data-lz-key="primaryCta"></a>
        <a class="lz-button lz-button--secondary lz-hero-columns__cta" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
    </div>
  </div>
</section>
