<section id="hero" data-lz-slot="hero" data-lz-variant="arch-sticker" data-lz-fit class="lz-section lz-hero-arch-sticker">
  <div class="lz-container lz-hero-arch-sticker__grid">
    <div class="lz-hero-arch-sticker__copy">
      <p class="lz-hero-arch-sticker__eyebrow">
        <span class="lz-hero-arch-sticker__dot" aria-hidden="true"></span>
        <span data-lz-key="eyebrow"></span>
      </p>
      <h1 class="lz-title lz-hero-arch-sticker__title" data-lz-key="title"></h1>
      <p class="lz-hero-arch-sticker__text" data-lz-key="text"></p>
      <div class="lz-hero-arch-sticker__actions">
        <a href="{{whatsappUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-hero-arch-sticker__cta">
          <span data-lz-key="primaryCta"></span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
        <a class="lz-button lz-button--secondary lz-hero-arch-sticker__cta" data-lz-attr-href="secondaryHref" data-lz-key="secondaryCta"></a>
      </div>
      <p class="lz-hero-arch-sticker__note" data-lz-if="note">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m20 6-11 11-5-5"/></svg>
        <span data-lz-key="note"></span>
      </p>
    </div>
    <div class="lz-hero-arch-sticker__media">
      <img fetchpriority="high" width="1000" height="1250" class="lz-hero-arch-sticker__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
      <span class="lz-hero-arch-sticker__sticker" data-lz-if="sticker" data-lz-key="sticker"></span>
    </div>
  </div>
</section>
