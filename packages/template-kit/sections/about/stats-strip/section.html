<section id="nosotros" data-lz-slot="about" data-lz-variant="stats-strip" class="lz-section lz-about-stats">
  <div class="lz-container">
    <div class="lz-section__head">
      <p class="lz-index" data-lz-key="kicker"></p>
    </div>
    <div class="lz-about-stats__intro">
      <h2 class="lz-title lz-title--section" data-lz-key="title"></h2>
      <p class="lz-about-stats__summary" data-lz-key="summary"></p>
    </div>
  </div>
  <div class="lz-about-stats__band">
    <div class="lz-container lz-about-stats__grid">
      <div class="lz-about-stats__stat" data-lz-each="stats">
        <p class="lz-about-stats__value" data-lz-key="value"></p>
        <p class="lz-about-stats__label" data-lz-key="label"></p>
      </div>
    </div>
  </div>
</section>
