<section
  id="nosotros"
  data-lz-slot="about"
  data-lz-variant="clock-rail"
  class="lz-section lz-about-clock-rail"
>
  <div class="lz-container">
    <div class="lz-about-clock-rail__head">
      <p
        class="lz-about-clock-rail__kicker"
        data-lz-if="kicker"
        data-lz-key="kicker"
      ></p>
      <h2 class="lz-title lz-about-clock-rail__title" data-lz-key="title"></h2>
      <p
        class="lz-about-clock-rail__summary"
        data-lz-if="summary"
        data-lz-key="summary"
      ></p>
    </div>
    <ol class="lz-about-clock-rail__rail" data-lz-if="moments">
      <li class="lz-about-clock-rail__stop" data-lz-each="moments">
        <span class="lz-about-clock-rail__time" data-lz-key="time"></span>
        <span class="lz-about-clock-rail__mark" aria-hidden="true"></span>
        <h3 class="lz-about-clock-rail__name" data-lz-key="title"></h3>
        <p
          class="lz-about-clock-rail__text"
          data-lz-if="text"
          data-lz-key="text"
        ></p>
      </li>
    </ol>
    <div class="lz-about-clock-rail__foot" data-lz-if="primaryCta">
      <p
        class="lz-about-clock-rail__note"
        data-lz-if="statement"
        data-lz-key="statement"
      ></p>
      <a
        href="{{whatsappUrl}}"
        target="_blank"
        rel="noopener noreferrer"
        class="lz-button lz-button--primary lz-about-clock-rail__cta"
        data-lz-key="primaryCta"
      ></a>
    </div>
  </div>
</section>
