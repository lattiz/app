<section id="resenas" data-lz-slot="testimonials" data-lz-variant="feature-stack" class="lz-section lz-testimonials-feature-stack">
  <div class="lz-container">
    <div class="lz-testimonials-feature-stack__head">
      <p class="lz-testimonials-feature-stack__kicker" data-lz-key="kicker"></p>
      <h2 class="lz-title lz-testimonials-feature-stack__title" data-lz-key="title"></h2>
      <p class="lz-testimonials-feature-stack__intro" data-lz-if="intro" data-lz-key="intro"></p>
    </div>
    <div class="lz-testimonials-feature-stack__grid">
      <figure class="lz-testimonials-feature-stack__card" data-lz-each="reviews">
        <p class="lz-testimonials-feature-stack__stars" data-lz-if="stars" data-lz-key="stars" aria-hidden="true"></p>
        <blockquote class="lz-testimonials-feature-stack__quote" data-lz-key="text"></blockquote>
        <figcaption class="lz-testimonials-feature-stack__by">
          <span class="lz-testimonials-feature-stack__avatar" data-lz-if="initials" data-lz-key="initials" aria-hidden="true"></span>
          <span class="lz-testimonials-feature-stack__who">
            <span class="lz-testimonials-feature-stack__author" data-lz-key="author"></span>
            <span class="lz-testimonials-feature-stack__place" data-lz-if="place" data-lz-key="place"></span>
          </span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
