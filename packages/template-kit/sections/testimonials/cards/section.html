<section id="resenas" data-lz-slot="testimonials" data-lz-variant="cards" class="lz-section lz-testimonials">
  <div class="lz-container">
    <div class="lz-section__head">
      <p class="lz-index" data-lz-key="kicker"></p>
    </div>
    <div class="lz-reviews__summary">
      <div class="lz-rating">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="lz-rating__g"><path fill="currentColor" d="M12.24 10.285v3.955h5.518c-.241 1.266-.964 2.339-2.053 3.061l3.318 2.576c1.934-1.783 3.047-4.406 3.047-7.532 0-.723-.065-1.418-.186-2.06H12.24z"></path><path fill="currentColor" d="M12 24c2.754 0 5.065-.913 6.754-2.473l-3.318-2.576c-.922.617-2.099.982-3.436.982-2.64 0-4.877-1.783-5.674-4.18H2.896v2.625A11.997 11.997 0 0 0 12 24z"></path><path fill="currentColor" d="M6.326 15.753A7.217 7.217 0 0 1 5.998 13c0-.957.164-1.886.328-2.753V7.622H2.896A11.997 11.997 0 0 0 0 13c0 1.935.463 3.767 1.287 5.378l5.039-2.625z"></path><path fill="currentColor" d="M12 4.767c1.498 0 2.844.516 3.904 1.528l2.931-2.931C17.057 1.71 14.746.796 12 .796A11.997 11.997 0 0 0 2.896 7.622l3.43 2.625C7.123 6.55 9.36 4.767 12 4.767z"></path></svg>
        <span class="lz-rating__score" data-lz-key="score"></span>
        <span aria-label="5 estrellas" class="lz-rating__stars">★★★★★</span>
        <span class="lz-rating__text" data-lz-key="summary"></span>
      </div>
      <div class="lz-reviews__actions">
        <a href="{{googleReviewsUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--secondary" data-lz-key="allReviewsCta"></a>
        <a href="{{googleReviewUrl}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary" data-lz-if="writeReviewCta" data-lz-key="writeReviewCta"></a>
      </div>
    </div>
    <div class="lz-reviews__grid">
      <article class="lz-review" data-lz-each="reviews">
        <div class="lz-review__body">
          <div class="lz-review__stars">★★★★★</div>
          <p class="lz-review__text" data-lz-key="text"></p>
          <p class="lz-review__meta" data-lz-key="author"></p>
        </div>
      </article>
    </div>
  </div>
</section>
