<section id="preguntas" data-lz-slot="faq" data-lz-variant="index-answers" class="lz-section lz-faq-index-answers">
  <div class="lz-container lz-faq-index-answers__grid">
    <div class="lz-faq-index-answers__head">
      <p class="lz-faq-index-answers__kicker" data-lz-if="kicker" data-lz-key="kicker"></p>
      <h2 class="lz-title lz-faq-index-answers__title" data-lz-key="title"></h2>
      <p class="lz-faq-index-answers__intro" data-lz-if="intro" data-lz-key="intro"></p>
      <a data-lz-if="cta" href="{{whatsappUrl:Hola, tengo una pregunta}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--secondary lz-faq-index-answers__cta" data-lz-key="cta"></a>
    </div>
    <div class="lz-faq-index-answers__list">
      <details open class="lz-faq-index-answers__item" data-lz-each="items">
        <summary class="lz-faq-index-answers__summary">
          <span class="lz-faq-index-answers__num" aria-hidden="true"></span>
          <span class="lz-faq-index-answers__question" data-lz-key="question"></span>
        </summary>
        <p class="lz-faq-index-answers__answer" data-lz-key="answer"></p>
      </details>
    </div>
  </div>
</section>
