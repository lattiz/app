<section id="preguntas" data-lz-slot="faq" data-lz-variant="list" class="lz-section lz-faq">
  <div class="lz-container">
    <div class="lz-section__head">
      <p class="lz-index" data-lz-key="kicker"></p>
    </div>
    <h2 class="lz-title lz-title--section" data-lz-key="title"></h2>
    <div class="lz-faq__list">
      <details open class="lz-faq__item" data-lz-each="items">
        <summary class="lz-faq__question">
          <span class="lz-faq__question-text" data-lz-key="question"></span>
          <span aria-hidden="true" class="lz-faq__icon"></span>
        </summary>
        <div class="lz-faq__answer">
          <p class="lz-faq__answer-text" data-lz-key="answer"></p>
        </div>
      </details>
    </div>
  </div>
</section>
