<section id="preguntas" data-lz-slot="faq" data-lz-variant="column-panels" class="lz-section lz-faq-column-panels">
  <div class="lz-container">
    <div class="lz-faq-column-panels__head">
      <p class="lz-faq-column-panels__kicker" data-lz-key="kicker"></p>
      <h2 class="lz-title lz-faq-column-panels__title" data-lz-key="title"></h2>
      <p class="lz-faq-column-panels__intro" data-lz-if="intro" data-lz-key="intro"></p>
    </div>
    <div class="lz-faq-column-panels__list">
      <details open class="lz-faq-column-panels__panel" data-lz-each="items">
        <summary class="lz-faq-column-panels__summary">
          <span class="lz-faq-column-panels__num" aria-hidden="true"></span>
          <span class="lz-faq-column-panels__question" data-lz-key="question"></span>
        </summary>
        <p class="lz-faq-column-panels__answer" data-lz-key="answer"></p>
      </details>
    </div>
    <a data-lz-if="cta" href="{{whatsappUrl:Hola, tengo una pregunta}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-faq-column-panels__cta" data-lz-key="cta"></a>
  </div>
</section>
