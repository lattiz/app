<section id="preguntas" data-lz-slot="faq" data-lz-variant="rule-table" class="lz-section lz-faq-rule-table">
  <div class="lz-container">
    <div class="lz-faq-rule-table__head">
      <div class="lz-faq-rule-table__heading">
        <p class="lz-faq-rule-table__kicker" data-lz-if="kicker" data-lz-key="kicker"></p>
        <h2 class="lz-title lz-faq-rule-table__title" data-lz-key="title"></h2>
      </div>
      <p class="lz-faq-rule-table__intro" data-lz-if="intro" data-lz-key="intro"></p>
    </div>
    <div class="lz-faq-rule-table__table">
      <p class="lz-faq-rule-table__cols" aria-hidden="true">
        <span data-lz-key="topicLabel"></span>
        <span data-lz-key="questionLabel"></span>
        <span data-lz-key="answerLabel"></span>
      </p>
      <details open class="lz-faq-rule-table__row" data-lz-each="items">
        <summary class="lz-faq-rule-table__summary">
          <span class="lz-faq-rule-table__topic" data-lz-key="topic"></span>
          <span class="lz-faq-rule-table__question" data-lz-key="question"></span>
        </summary>
        <p class="lz-faq-rule-table__answer" data-lz-key="answer"></p>
      </details>
    </div>
    <a data-lz-if="cta" href="{{whatsappUrl:Hola, tengo una pregunta}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--secondary lz-faq-rule-table__cta" data-lz-key="cta"></a>
  </div>
</section>
