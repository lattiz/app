<section id="preguntas" data-lz-slot="faq" data-lz-variant="grid" class="lz-section lz-faq-grid">
  <div class="lz-container">
    <div class="lz-faq-grid__head">
      <h2 class="lz-title lz-title--section lz-faq-grid__title" data-lz-key="title"></h2>
      <p class="lz-faq-grid__intro" data-lz-if="intro" data-lz-key="intro"></p>
    </div>
    <div class="lz-faq-grid__list">
      <details open class="lz-faq-grid__item" data-lz-each="items">
        <summary class="lz-faq-grid__question" data-lz-key="question"></summary>
        <p class="lz-faq-grid__answer" data-lz-key="answer"></p>
      </details>
    </div>
    <a data-lz-if="cta" href="{{whatsappUrl:Hola, tengo una pregunta}}" target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-faq-grid__cta" data-lz-key="cta"></a>
  </div>
</section>
