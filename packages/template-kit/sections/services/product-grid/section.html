<section id="servicios" data-lz-slot="services" data-lz-variant="product-grid" class="lz-section lz-services-products">
  <div class="lz-container">
    <div class="lz-section__head">
      <p class="lz-index" data-lz-key="kicker"></p>
    </div>
    <h2 class="lz-title lz-title--section" data-lz-key="title"></h2>
    <p class="lz-services-products__intro" data-lz-if="intro" data-lz-key="intro"></p>
    <div class="lz-services-products__grid">
      <article class="lz-product" data-lz-each="products">
        <img loading="lazy" width="800" height="1000" class="lz-product__image" data-lz-attr-src="image" data-lz-attr-alt="imageAlt">
        <div class="lz-product__body">
          <h3 class="lz-product__name" data-lz-key="name"></h3>
          <p class="lz-product__desc" data-lz-key="description"></p>
          <div class="lz-product__row">
            <p class="lz-product__price" data-lz-key="price"></p>
            <a target="_blank" rel="noopener noreferrer" class="lz-button lz-button--primary lz-product__cta" data-lz-attr-href="href" data-lz-key="cta"></a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
