<section id="servicios" data-lz-slot="services" data-lz-variant="menu-columns" class="lz-section lz-services-menu">

    <div class="lz-services-menu__head">
      <h2 class="lz-title lz-title--section lz-services-menu__title" data-lz-key="title"></h2>

    <ul class="lz-services-menu__list">
      <li class="lz-services-menu__item" data-lz-each="prices">
