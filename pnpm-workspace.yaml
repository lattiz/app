packages:
  - 'apps/*'
  - 'packages/*'
# Exact pin (not a range): apps/web floats ^19.2.0 while apps/tenant-sites pinned 19.2.4,
# so a range override let both patches coexist — a second React copy crashes GrapesJS
# ("reading 'useMemo'"). Pinning collapses every importer onto one react/react-dom.
overrides:
  react: 19.2.4
  react-dom: 19.2.4
allowBuilds:
  '@nestjs/core': false
  # Jest deps: prebuilt binaries ship as optional deps — no postinstall build needed.
  '@parcel/watcher': false
  '@scarf/scarf': false
  esbuild: true
  # protobufjs postinstall only warns about version mismatches (GA clients) — not needed.
  protobufjs: false
  # tenant-sites uses raw <img> + next/og (wasm), not next/image — no native build.
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@hey-api/codegen-core@0.9.0'
  - '@hey-api/openapi-ts@0.98.2'
  - '@hey-api/shared@0.4.8'
  - '@supabase/auth-js@2.108.0'
  - '@supabase/functions-js@2.108.0'
  - '@supabase/postgrest-js@2.108.0'
  - '@supabase/realtime-js@2.108.0'
  - '@supabase/storage-js@2.108.0'
  - '@supabase/supabase-js@2.108.0'
