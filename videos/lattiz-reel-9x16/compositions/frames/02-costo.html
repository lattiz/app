      // Particle table built lazily on the first particle frame (fonts loaded by then). Seeded LCG.

      function raster(lines, size, spacing) {
        const off = document.createElement("canvas");
        off.width = W; off.height = H;
        const o = off.getContext("2d", { willReadFrequently: true });
        o.font = "800 " + size + "px Geist, 'Helvetica Neue', Arial, sans-serif";

        for (let yy = 0; yy < H; yy += 5) for (let xx = 0; xx < W; xx += 5) if (d[(yy * W + xx) * 4 + 3] > 127) cells.push([xx, yy]);

      }
      function build() {
        let s = 0x5eed1447;
        const rnd = function () { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 4294967296; };
        const src = raster([["$6,000 –", 540, 666], ["$80,000", 540, 856]], 172, "-8.6px");
        for (let i = 0; i < 220; i++) src.push([480 + rnd() * 120, 370 + rnd() * 92]);
        const tgt = raster([["Todo", 540, 698], ["incluido", 540, 898]], 196, "-10.8px");
        const N = 1700, rows = [];
        for (let i = 0; i < N; i++) {
          const sp = src[Math.floor(rnd() * src.length)] || [540, 700];
          const tp = tgt[Math.floor((i / N) * tgt.length)] || [540, 800];
          const ang = rnd() * Math.PI * 2;
          rows.push({ sx: sp[0], sy: sp[1], tx: tp[0], ty: tp[1], dx: Math.cos(ang) * 0.8, dy: Math.sin(ang), dist: 90 + rnd() * 360, delay: rnd() * 0.18, r: 1.8 + rnd() * 1.9, blueText: tp[1] > 800 });
        }

        for (let i = 0; i < table.length; i++) {

          const pa = out3(clamp((t - BURST) / (GATHER - BURST)));
          const bx = r.sx + r.dx * r.dist * pa, by = r.sy + r.dy * r.dist * pa;
          const pb = inOut(clamp((t - GATHER - r.delay) / (SETTLE - GATHER - 0.18)));

          ctx.arc(x, y, r.r, 0, 6.2832);
