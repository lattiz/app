      const b = document.getElementById("f02-b");
      const canvas = document.getElementById("f02-canvas");
      const ctx = canvas.getContext("2d");
      const fmt = function (n) { return "$" + Math.round(n).toLocaleString("en-US"); };
      const clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
      const out3 = function (t) { return 1 - Math.pow(1 - t, 3); };
      const inOut = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

      // Particle table built once, lazily, the first time a particle frame is painted
      // (fonts are loaded by then). Seeded LCG — no Math.random.
      let table = null;
      function raster(text, x, y, size, spacing) {
        const off = document.createElement("canvas");
        off.width = 1920; off.height = 1080;
        const o = off.getContext("2d", { willReadFrequently: true });
        o.font = "800 " + size + "px Geist, 'Helvetica Neue', Arial, sans-serif";
        if ("letterSpacing" in o) o.letterSpacing = spacing;
        o.textAlign = "center"; o.textBaseline = "middle"; o.fillStyle = "#fff";
        o.fillText(text, x, y);
        const d = o.getImageData(0, 0, 1920, 1080).data;
        const cells = [];
        for (let yy = 0; yy < 1080; yy += 5) for (let xx = 0; xx < 1920; xx += 5) if (d[(yy * 1920 + xx) * 4 + 3] > 127) cells.push([xx, yy]);
        return cells;
      }
      function build() {
        let s = 0x5eed1447;
        const rnd = function () { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 4294967296; };
        const src = raster("$6,000 – $80,000", 870, 424, 168, "-8.4px");
        for (let i = 0; i < 260; i++) src.push([1594 + rnd() * 142, 386 + rnd() * 108]);
        const tgt = raster("Todo incluido", 960, 468, 176, "-9.7px");
        const N = 1700, rows = [];
        for (let i = 0; i < N; i++) {
          const sp = src[Math.floor(rnd() * src.length)] || [960, 420];
          const tp = tgt[Math.floor((i / N) * tgt.length)] || [960, 468];
          const ang = rnd() * Math.PI * 2;
          rows.push({ sx: sp[0], sy: sp[1], tx: tp[0], ty: tp[1], dx: Math.cos(ang), dy: Math.sin(ang) * 0.75, dist: 90 + rnd() * 340, delay: rnd() * 0.18, r: 1.6 + rnd() * 1.8, blueText: tp[0] > 880 });
        }
        return rows;
      }
      function paint(t) {
        ctx.clearRect(0, 0, 1920, 1080);
        if (t < BURST || t > END) return;
        if (!table) table = build();
        const colorMix = clamp((t - 2.85) / 0.5);
        for (let i = 0; i < table.length; i++) {
          const r = table[i];
          const pa = out3(clamp((t - BURST) / (GATHER - BURST)));
          const bx = r.sx + r.dx * r.dist * pa, by = r.sy + r.dy * r.dist * pa;
          const pb = inOut(clamp((t - GATHER - r.delay) / (SETTLE - GATHER - 0.18)));
          const x = bx + (r.tx - bx) * pb, y = by + (r.ty - by) * pb;
          const alpha = clamp((t - BURST) / 0.06) * (1 - clamp((t - 3.88) / 0.3));
          if (alpha <= 0.01) continue;
          const ink = r.blueText ? [20, 71, 230] : [11, 16, 32];
          const c = [255 + (ink[0] - 255) * colorMix, 255 + (ink[1] - 255) * colorMix, 255 + (ink[2] - 255) * colorMix];
          ctx.fillStyle = "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + alpha.toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(x, y, r.r, 0, 6.2832);
          ctx.fill();
        }
      }

      const tl = gsap.timeline({
        paused: true,
        onUpdate: function () {
          const t = tl.time();
          // Odometer: first figure 0 → 6,000, then the ceiling rolls 6,000 → 80,000.
          a.textContent = fmt(6000 * out3(clamp((t - 0.3) / 0.75)));
          b.textContent = fmt(6000 + 74000 * out3(clamp((t - 1.15) / 0.95)));
          paint(t);
        },
      });

      tl.fromTo("#f02-price", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.25);
      tl.fromTo("#f02-b", { y: 0 }, { y: -6, duration: 0.95, ease: "power3.out" }, 1.15);

      // Padlock snaps on with a click + micro-shake.
      tl.fromTo("#f02-lock", { y: -260, rotation: -18, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.38, ease: "back.out(2.2)" }, 1.98);

      tl.fromTo("#f02-chip", { y: 24, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 2.2);
